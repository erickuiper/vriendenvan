name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit & component tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (dev server)
        run: npm run test:e2e
        env:
          CI: true

      - name: Build Docker image
        run: docker build -t vriendenvan:test .

      - name: Run container
        run: |
          docker run -d -p 8080:80 --name app vriendenvan:test
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -q 200; then break; fi
            if [ "$i" -eq 30 ]; then exit 1; fi
            sleep 1
          done

      - name: E2E tests (Docker)
        run: npm run test:e2e:docker
        env:
          CI: true
          DOCKER_BASE_URL: http://localhost:8080

      - name: Stop container
        if: always()
        run: docker stop app 2>/dev/null || true; docker rm app 2>/dev/null || true

  push-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: erickuiper/vriendenvan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
